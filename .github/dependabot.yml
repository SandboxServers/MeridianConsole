# Dependabot configuration (issue #129, chunk P0.8).
# Covers the four npm manifests, NuGet (central package management at the repo root)
# and GitHub Actions.
# Version updates are grouped per directory (patch + minor) so the alert backlog
# cannot re-accumulate one PR at a time; majors still arrive as individual PRs.
version: 2

updates:
  - package-ecosystem: npm
    directory: /src/Dhadgar.Panel
    schedule:
      interval: weekly
    groups:
      panel-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      panel-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /src/Dhadgar.Scope
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1, so the TypeScript 7
      # update cannot resolve. Lift this when typescript-eslint supports 7.
      - dependency-name: 'typescript'
        versions:
          - '>= 7.0.0'
    groups:
      scope-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      scope-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /src/Dhadgar.BetterAuth
    schedule:
      interval: weekly
    groups:
      betterauth-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      betterauth-security:
        applies-to: security-updates
        patterns:
          - '*'

  # Bumps the SHA-pinned actions (and their # vX.Y.Z comments) in workflows and
  # in the local composite actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    ignore:
      # Only published as a moving `v1` tag. Dependabot resolves it to the
      # 2021 tag commit and proposes that as a "bump" (#207); update by hand.
      - dependency-name: 'Azure/static-web-apps-deploy'
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # MassTransit v9+ is commercially licensed; stay on 8.x until the
      # OpenTransit switch (#195).
      - dependency-name: 'MassTransit*'
        update-types:
          - version-update:semver-major
      # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi < 3.0
      # (#216). Lift this when ASP.NET Core moves to OpenApi 3.
      - dependency-name: 'Microsoft.OpenApi'
        update-types:
          - version-update:semver-major
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      nuget-security:
        applies-to: security-updates
        patterns:
          - '*'
