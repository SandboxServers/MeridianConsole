# CodeQL static analysis (SAST) for C#, TypeScript/JavaScript and the workflows
# themselves. Results appear under Security > Code scanning.
# Replaces the (disabled) security scan stage of azure-pipelines.yml.
# Runs nightly against main rather than on every PR, so findings are triaged
# from the Security tab instead of blocking merges.
name: CodeQL

on:
  schedule:
    - cron: '23 6 * * *' # nightly, 06:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none analyses source without compiling, so no .NET or npm setup.
        language:
          - actions
          - csharp
          - javascript-typescript
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
