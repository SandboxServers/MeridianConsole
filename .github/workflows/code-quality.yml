name: Code Quality & Security

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'sast-**'  # SAST/linter discovery branches
  pull_request:
    branches:
      - main
      - develop

permissions: {}

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The .NET analyzer build (TreatWarningsAsErrors under CI=true) runs in ci.yml,
# which builds the solution once for both analysis and tests.
jobs:
  # Setup job: Check for Dockerfiles
  check-dockerfiles:
    name: Check for Dockerfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has-dockerfiles: ${{ steps.check.outputs.files-found }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Dockerfiles
        id: check
        run: |
          if find . -name "Dockerfile*" -type f | grep -q .; then
            echo "files-found=true" >> "$GITHUB_OUTPUT"
          else
            echo "files-found=false" >> "$GITHUB_OUTPUT"
          fi

  # Lint YAML files
  yaml-lint:
    name: Lint YAML
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Run yamllint
        run: yamllint --strict .

  # Lint GitHub Actions workflows and composite actions. Covers the files listed in
  # LINTED_WORKFLOWS; add the gemini/pr-agent workflows once their existing
  # findings (unpinned actions, issue_comment trigger) are fixed.
  workflow-lint:
    name: Lint Workflows (actionlint + zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LINTED_WORKFLOWS: >-
        .github/workflows/ci.yml
        .github/workflows/_dotnet-build-test.yml
        .github/workflows/code-quality.yml
        .github/workflows/codeql.yml
        .github/workflows/containers.yml
        .github/workflows/helm-publish.yml
        .github/workflows/infra.yml
        .github/workflows/static-web-apps.yml
      LINTED_ACTIONS: >-
        .github/actions/npm-ci/action.yml
        .github/actions/setup-dotnet-env/action.yml
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint 1.7.12 predates the `$/` self-repository syntax (GitHub, 2026-07-30).
      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # shellcheck disable=SC2086 # word-split the file list on purpose
          "$(go env GOPATH)/bin/actionlint" -color \
            -ignore 'specifying action "\$/[^"]+" in invalid format because ref is missing' \
            -ignore 'reusable workflow call "\$/[^"]+" at "uses" is not following the format' \
            $LINTED_WORKFLOWS

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install zizmor==1.31.1
          # shellcheck disable=SC2086 # word-split the file lists on purpose
          zizmor --format=github --min-severity=low $LINTED_WORKFLOWS $LINTED_ACTIONS

  # Lint frontend (TypeScript/React/Astro)
  frontend-lint:
    name: Lint Frontend (ESLint + Prettier)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: $/.github/actions/npm-ci
        with:
          directories: src/Dhadgar.Scope

      - name: Run ESLint
        working-directory: src/Dhadgar.Scope
        run: npm run lint

      - name: Check Prettier formatting
        working-directory: src/Dhadgar.Scope
        run: npm run format:check

  # Lint Dockerfiles
  dockerfile-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: check-dockerfiles
    # Only run if Dockerfiles exist
    if: needs.check-dockerfiles.outputs.has-dockerfiles == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: '**/Dockerfile*'
          config: .hadolint.yaml
          recursive: true
          failure-threshold: error

  # Summary job (all linters must pass)
  code-quality-summary:
    name: Code Quality Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [yaml-lint, workflow-lint, frontend-lint, dockerfile-lint]
    if: always()
    permissions: {}
    steps:
      - name: Check all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more code quality checks failed"
          exit 1

      - name: All checks passed
        run: echo "✅ All code quality and security checks passed!"
