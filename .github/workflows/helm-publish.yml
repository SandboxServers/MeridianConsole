# Lints the meridian-console Helm chart on pull requests and publishes it to GHCR
# as an OCI chart (oci://ghcr.io/sandboxservers/charts/meridian-console) from main
# and from releases. Install with:
#   helm install meridian oci://ghcr.io/sandboxservers/charts/meridian-console --version <version>
name: Helm Chart

on:
  push:
    branches:
      - main
    paths: &chart-paths
      - 'deploy/kubernetes/helm/meridian-console/**'
      - '.github/workflows/helm-publish.yml'
  pull_request:
    branches:
      - main
      - develop
    paths: *chart-paths
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHART_DIR: deploy/kubernetes/helm/meridian-console
  CHART_REPO: oci://ghcr.io/sandboxservers/charts

jobs:
  chart:
    name: Lint and publish chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the chart (not on pull requests)
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - name: Build chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build "$CHART_DIR"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        id: package
        run: |
          helm package "$CHART_DIR" --destination dist
          version=$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/meridian-console-${VERSION}.tgz" "$CHART_REPO"
          helm registry logout ghcr.io
          {
            echo "## Helm chart published"
            echo ""
            echo "\`meridian-console\` \`${VERSION}\` pushed to \`${CHART_REPO}\`."
            echo ""
            echo '```bash'
            echo "helm install meridian ${CHART_REPO}/meridian-console --version ${VERSION} \\"
            echo "  --namespace meridian-system --create-namespace"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
