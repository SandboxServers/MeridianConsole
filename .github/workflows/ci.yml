# Pull request and branch CI. Replaces the Build & Test stage of azure-pipelines.yml;
# container builds and deployments still run in Azure Pipelines.
name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; let every push to a branch finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: .NET
    uses: $/.github/workflows/_dotnet-build-test.yml
    permissions:
      contents: read
      checks: write
    with:
      configuration: Release

  # One stable check name for rulesets, whatever the jobs above are called.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [dotnet]
    if: always()
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != 'success' ] && [ "$r" != 'skipped' ]; then
              echo "::error::CI failed ($RESULTS)"
              exit 1
            fi
          done
