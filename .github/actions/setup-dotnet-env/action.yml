name: Set up .NET and restore
description: >-
  Installs the .NET SDK pinned by global.json, caches NuGet packages keyed on every
  packages.lock.json, and optionally restores a project or solution in locked mode.

inputs:
  restore:
    description: Run dotnet restore after installing the SDK ('true' or 'false').
    required: false
    default: 'true'
  project:
    description: Project or solution to restore.
    required: false
    default: Dhadgar.sln

runs:
  using: composite
  steps:
    - name: Setup .NET (global.json)
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Restore (locked mode)
      if: inputs.restore == 'true'
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: dotnet restore "$PROJECT" --locked-mode
