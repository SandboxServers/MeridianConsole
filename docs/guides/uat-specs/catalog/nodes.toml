  start = "after_step:mint"
  heal = "after_steps"

  [[row.step]]
  id = "up"
  tool = "stack_up"

  [[row.step]]
  id = "start-nodes"
  tool = "svc_start"
  args = { service = "nodes" }

  [[row.step]]
  id = "start-gateway"
