  required = true

  [[row.expect]]
  id = "recovered"
  text = "Nodes GET /healthz returns 200 after the heal"
  source = "http"
  via = "nodes"
  method = "GET"
  path = "/healthz"
  op = "eq"
  pointer = "/status"
  value = 200
  since = "fault_heal:pg-latency"
  timeout_ms = 60000
  poll_ms = 1000
  required = true

[[row]]
id = "nodes-rabbit-down-outbox"
title = "With the broker cut the outbox decouples the enroll; Nodes stays 200 and the outbox drains after the heal"
expected = "The enroll returns 201 and /healthz returns 200 (Degraded) while RabbitMQ is cut; undelivered outbox rows reach zero within 60 s of the heal"
allow_invariants = []

  [[row.fault]]
  id = "rabbit"
  inject = { tool = "fault_proxy_disable", args = { proxy = "nodes-rabbitmq" } }
  start = "after_step:mint"
  heal = "after_step:health-down"

  [[row.step]]
  id = "up"
  tool = "stack_up"

  [[row.step]]
  id = "start-nodes"
  tool = "svc_start"
  args = { service = "nodes" }

  [[row.step]]
  id = "start-gateway"
  tool = "svc_start"
  args = { service = "gateway" }

  [[row.step]]
  id = "mint"
  tool = "nodes_token_mint"
  args = { label = "catalog-rabbit-${run_id}" }
  capture = { token_ref = "/token_ref" }

  [[row.step]]
  id = "probe"
  tool = "nodes_enroll_probe"
  args = { token_ref = "${token_ref}", platform = "linux", via = "gateway" }

  [[row.step]]
  id = "health-down"
  tool = "http_request"
  args = { via = "nodes", method = "GET", path = "/healthz" }

  [[row.expect]]
  id = "enroll-201"
  text = "the enroll returns 201 while the broker is cut"
  source = "step"
  step = "probe"
  pointer = "/result/status"
  op = "eq"
  value = 201
  required = true

  [[row.expect]]
  id = "health-200-degraded"
  text = "Nodes /healthz is 200 (masstransit Degraded, F68) while the broker is cut"
  source = "step"
  step = "health-down"
  pointer = "/result/status"
  op = "eq"
  value = 200
  required = true

  [[row.expect]]
  id = "outbox-drained"
  text = "undelivered outbox rows reach zero within 60 s of the heal"
  source = "db"
  database = "nodes"
  sql = 'select count(*) as pending from "OutboxMessage" where "Delivered" is null'
  op = "eq"
  pointer = "/rows/0/pending"
  value = 0
  since = "fault_heal:rabbit"
  timeout_ms = 60000
  poll_ms = 5000
  required = true

[[row]]
id = "nodes-killed-enroll"
title = "A killed Nodes fails the enroll without burning the token; the same token enrolls once Nodes is back"
expected = "The enroll returns 502 or 503 while Nodes is killed; after the heal the same token returns 201 within 90 s"
allow_invariants = []

  [[row.fault]]
  id = "kill"
  inject = { tool = "fault_kill", args = { target = "c:nodes", signal = "KILL" } }
  start = "after_step:mint"
  heal = "after_step:kill-enroll"

  [[row.step]]
  id = "up"
  tool = "stack_up"

  [[row.step]]
  id = "start-nodes"
  tool = "svc_start"
  args = { service = "nodes" }

  [[row.step]]
  id = "start-gateway"
  tool = "svc_start"
  args = { service = "gateway" }

  [[row.step]]
  id = "mint"
  tool = "nodes_token_mint"
  args = { label = "catalog-killed-${run_id}" }
  capture = { token_ref = "/token_ref" }

  [[row.step]]
  id = "kill-enroll"
  tool = "nodes_enroll_probe"
  args = { token_ref = "${token_ref}", platform = "linux", via = "gateway" }

  [[row.step]]
  id = "await"
  wait_ms = 30000

  [[row.step]]
  id = "enroll-again"
  tool = "nodes_enroll_probe"
  args = { token_ref = "${token_ref}", platform = "linux", via = "gateway" }

  [[row.expect]]
  id = "killed-502-503"
  text = "the enroll while Nodes is killed returns 502 or 503"
  source = "step"
  step = "kill-enroll"
  pointer = "/result/status"
  op = "any"
  value = [502, 503]
  required = true

  [[row.expect]]
  id = "same-token-201"
  text = "the same token enrolls with 201 after Nodes is started again"
  source = "step"
  step = "enroll-again"
  pointer = "/result/status"
  op = "eq"
  value = 201
  required = true

  [[row.expect]]
  id = "recovered"
  text = "Nodes GET /healthz returns 200 after the heal"
  source = "http"
  via = "nodes"
  method = "GET"
  path = "/healthz"
  op = "eq"
  pointer = "/status"
  value = 200
  since = "fault_heal:kill"
  timeout_ms = 90000
  poll_ms = 1000
  required = true

