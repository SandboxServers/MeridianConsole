schema = 1

# Expected-failure catalog for Nodes (L23). Each row states the designed failure, mints what it needs first, and sets allow_invariants = [].
# Enroll-route calls per row (F54, poll_ms = 5000 where a clause polls the enroll route; recovery clauses poll /healthz, not the enroll route):
#   nodes-pg-down-enroll 2, nodes-pg-latency 1, nodes-rabbit-down-outbox 1, nodes-killed-enroll 2, nodes-pg-terminate 1,
#   nodes-pg-readonly 2, nodes-ca-key-corrupt 1, nodes-token-expired 1, nodes-token-reuse-after-failure 3, nodes-enroll-malformed 3. Each is under 25 per 60 s by the spec's own count.
# A 429 in these rows is a lab spec defect, never a product finding. The CA route is never called through the Gateway (D-ML63).

[section]
id = "catalog-nodes"
title = "Nodes expected-failure catalog"
sequential = true
requires = ["docker"]
allow_invariants = []

[[row]]
id = "nodes-pg-down-enroll"
title = "An enroll while Nodes' Postgres is cut fails with the designed 503; the same token enrolls after the heal"
expected = "The enroll returns 503 while Postgres is cut; the token is unused until a fresh enroll after the heal returns 201"
known_issue = "KI-F67"

  [[row.fault]]
  id = "pg"
  inject = { tool = "fault_proxy_disable", args = { proxy = "nodes-postgres" } }
  start = "after_step:mint"
  heal = "after_step:enroll-down"

  [[row.step]]
  id = "up"
  tool = "stack_up"
  args = { wipe = true }

  [[row.step]]
  id = "start-nodes"
  tool = "svc_start"
  args = { service = "nodes" }

  [[row.step]]
  id = "start-gateway"
  tool = "svc_start"
  args = { service = "gateway" }

  [[row.step]]
  id = "mint"
  tool = "nodes_token_mint"
  args = { label = "catalog-pg-down-${run_id}" }
  capture = { token_ref = "/token_ref", token_id = "/token_id" }

  [[row.step]]
  id = "enroll-down"
  tool = "nodes_enroll_probe"
  args = { token_ref = "${token_ref}", platform = "linux", via = "gateway" }
  expect_error = "http:503"

  [[row.step]]
  id = "settle"
  wait_ms = 10000

  [[row.step]]
  id = "enroll-after"
  tool = "nodes_enroll_probe"
  args = { token_ref = "${token_ref}", platform = "linux", via = "gateway" }

  [[row.expect]]
  id = "down-503"
  text = "the enroll while Postgres is cut returns 503"
  source = "step"
  step = "enroll-down"
  pointer = "/result/status"
  op = "eq"
  value = 503
  required = true

  [[row.expect]]
  id = "after-201"
  text = "the same token enrolls with 201 after the heal"
  source = "step"
  step = "enroll-after"
  pointer = "/result/status"
  op = "eq"
  value = 201
  required = true

  [[row.expect]]
  id = "recovered"
  text = "Nodes GET /healthz returns 200 after the heal"
  source = "http"
  via = "nodes"
  method = "GET"
  path = "/healthz"
  op = "eq"
  pointer = "/status"
  value = 200
  since = "fault_heal:pg"
  timeout_ms = 60000
  poll_ms = 1000
  required = true

  [[row.expect]]
  id = "token-used"
  text = "the token row is used after the fresh enroll"
  source = "db"
  database = "nodes"
  sql = 'select "UsedAt" as used_at from enrollment_tokens where "Id" = @id::uuid'
  params = { id = "${token_id}" }
  op = "truthy"
  pointer = "/rows/0/used_at"
  timeout_ms = 0
  required = true

[[row]]
id = "nodes-pg-latency"
