[[row]]
id = "nodes-enroll-malformed"
title = "Malformed enroll bodies through the Gateway are refused with 400 problem+json"
expected = "An empty body, a wrong-typed field and an oversized string field each return 400"
allow_invariants = []

  [[row.step]]
  id = "empty"
  tool = "http_request"
  args = { via = "gateway", method = "POST", path = "/api/v1/agents/enroll", body = {} }
  expect_error = "http:400"

  [[row.step]]
  id = "wrong-type"
  tool = "http_request"
  args = { via = "gateway", method = "POST", path = "/api/v1/agents/enroll", body = { platform = 12345 } }
  expect_error = "http:400"

  [[row.expect]]
  id = "problem-json"
  text = "the malformed enroll reply is application/problem+json"
  source = "step"
  step = "wrong-type"
  pointer = "/result/headers/content-type"
  op = "contains"
  value = "application/problem+json"
  required = true
