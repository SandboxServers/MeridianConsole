# Enrollment history scenarios (C19). Read by history_run, not by uat_run.
# clients is the default; history_run.clients overrides it for the race scenarios (2..8).
# retry: none | same_key | new_key. first_op_action: hold_request | drop_response.

schema = 1

[[scenario]]
id = "enroll-race"
clients = 4
retry = "none"
first_op_action = "hold_request"

[[scenario]]
id = "enroll-race-pg-latency"
clients = 4
retry = "none"
first_op_action = "hold_request"

[[scenario.fault]]
id = "pg-latency"
start = "before_steps"
heal = "after_steps"
[scenario.fault.inject]
tool = "fault_toxic_add"
args = { proxy = "nodes-postgres", toxic = "latency", stream = "downstream", attributes = { latency = 200 } }

[[scenario]]
id = "enroll-lost-response"
clients = 1
retry = "same_key"
first_op_action = "drop_response"

[[scenario]]
id = "enroll-lost-response-new-key"
clients = 1
retry = "new_key"
first_op_action = "drop_response"
